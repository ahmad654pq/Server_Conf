# Options
set-option -g default-terminal "screen-256color"
set-option -g terminal-overrides ",xterm-256color:RGB"

unbind r
bind r source-file  ~/.tmux.conf
set -g mouse on

set -g prefix M-x

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


#List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

#configure Navigator
set -g @vim_navigator_mapping_left "M-Left"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "M-Right"
set -g @vim_navigator_mapping_up "M-Up"
set -g @vim_navigator_mapping_down "M-Down"

#Window Switching
bind -n M-z next-window

#Session Switching
bind -n C-S-a switch-client -n

#Session killing
bind -n C-S-x kill-session

#Panel killing
bind -n C-S-k kill-pane







set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# Configure Catppuccin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status left look and feel
set -g status-left-length 100
set -g status-left ""

set -ga status-left "#{?client_prefix,#{#[bg=none]#[fg=#f7db09,bold]  #{session_name} },#{#[bg=none]#[fg=#F92672]  #{session_name} }}"

set -ga status-left "#[bg=none]#[fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=none]#[fg=#79ff1f]  #{pane_current_command} "
set -ga status-left "#[bg=none]#[fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=none]#[fg=#45e6ee]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=none]#[fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=none#[fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right "#[fg=#eacd23] #{mem}"
set -ga status-right "#[bg=none]#[fg=#{@thm_overlay_0}, none] |"
set -ga status-right "#[bg=none]#[fg=#F92672, none]"
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red}]#[fg=#{@thm_bg}]},#{#[bg=none]#[fg=#F92672]}} #{battery_icon}#{battery_percentage} "

set -ga status-right "#[bg=none]#[fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=none]#{?#{==:#{online_status},ok},#[fg=#79ff1f] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=none]#[fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=none]#[fg=#45e6ee] 󰅐 %H:%M "

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)

# Configure Tmux
set -g status-position top
set -g status-style "bg=none,fg=#{@thm_overlay_0},none"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=none,fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=none,fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=none]#[fg=#45e6ee]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"


run '~/.tmux/plugins/tpm/tpm'
